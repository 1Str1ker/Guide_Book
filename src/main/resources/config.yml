# 
# 🛠 ДОСТУПНІ КОМАНДИ:
# /gb (або /guide, /menu, /help) - Відкрити головне меню
# /gb adminhelp - Показати всі адмін-команди
# /gb add <id> [слот] - Створити новий гайд з книги в руці
# /gb edit <id> - Оновити текст існуючого гайду
# /gb give <назва> - Отримати заготовку (Книгу з пером)
# /gb drop <id> [гравець] - Видати гайд як фізичний предмет
# /gb size <9-54> - Змінити розмір меню (кратне 9)
# /gb delete <id> - Видалити гайд із меню
# /gb reload - Перезавантажити цей конфіг
#
# 🎨 ФОРМАТУВАННЯ ТЕКСТУ В КНИГАХ:
# ВАЖЛИВО: Замість &r використовуйте &0 (чорний), інакше 
# текст стане білим і зіллється зі сторінкою книги!
# - Класичні кольори: &0 (чорний), &1, &4, &l (жирний)
# - Посилання на сайт: [Назва сайту](https://ваш-сайт.com)
# - Кнопка-команда: [🔙 Повернутися в меню](/gb)
#
# 🔐 ПРАВА ДОСТУПУ (Permissions):
# Додайте параметр permission: "якийсь.дозвіл", щоб гайд бачили
# лише ті гравці, які мають це право. Якщо залишити "", бачитимуть усі.
# =========================================================

gui:
  title: "&#FFD700Д&#FFC100о&#FFAA00в&#FF9400і&#FF7D00д&#FF6700н&#FF5000и&#FF3A00к &#FF2300Сервера"
